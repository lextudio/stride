name: Test the released OpenDevelop add-in

# Installs the PUBLISHED ICSharpCode.StrideGameStudio.odaddin (the asset of a release of this repository, downloaded from GitHub and checked
# against the release's SHA-256 digest) into an isolated OpenDevelop release on Windows and Linux, restarts it, and checks that the
# add-in loads and shows the assets of a Stride game: the same journey as sources/tools/Stride.OpenDevelop.AddIn.Tests/StrideOdaddinInstallTests.cs.
# Windows also opens a scene (STRIDE_CHECK_VIEWPORT=1: a real SDL window over the viewport, frames advancing, pixels on screen) and
# uploads the screenshots; Linux has no scene viewport yet, so its job only checks the install journey. macOS is not in the matrix: its
# runners are not available to this repository (the job never gets one); it is tested on a developer machine. The Stride game is restored first, or its
# engine assets and shaders would not load and the viewport would stay black.
#
# Run it by hand after a release (gh workflow run test-odaddin-release.yml --ref librewpf-port -f tag=v0.1.0), or push a change to this file:
# that run tests the default release below.

on:
  push:
    branches: [librewpf-port]
    paths:
      - '.github/workflows/test-odaddin-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release of this repository to test'
        default: 'v0.1.0'
      opendevelop_tag:
        description: 'OpenDevelop release to install it into'
        default: 'v5.9.1'
      run_id:
        description: 'Optional: id of a release-odaddin.yml run whose package artifact is tested instead of the release (to test a change before releasing it); the tag above must be the version in its manifest'
        default: ''
      linux_vulkan:
        description: 'Linux Vulkan driver: stride (the Lavapipe build Stride''s own Linux GPU tests use, Stride.Dependencies.Lavapipe) or mesa (Ubuntu''s)'
        default: 'stride'
      windows_vulkan:
        description: 'Diagnostic: render on Windows with Vulkan (Stride''s Lavapipe) instead of Direct3D11, to compare with Linux'
        type: boolean
        default: false
      dump_run_id:
        description: 'Diagnostic: only analyse the crash dump artifact of this earlier run (crash-dumps-windows-x64) with cdb; no test runs'
        default: ''

permissions:
  contents: read
  # The restore may reach LeXtudio's GitHub Packages (nuget.config: lextudio_github), with this job's token, as in release-odaddin.yml.
  packages: read

env:
  ASSET: ICSharpCode.StrideGameStudio.odaddin
  OPENDEVELOP_REPOSITORY: lextudio/OpenDevelop
  OPENDEVELOP_TAG: ${{ inputs.opendevelop_tag || 'v5.9.1' }}
  STRIDE_TAG: ${{ inputs.tag || 'v0.1.0' }}
  STRIDE_RUN_ID: ${{ inputs.run_id || '' }}

jobs:
  analyze-dump:
    name: Analyse a crash dump
    if: inputs.dump_run_id != ''
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Print the crashing thread's native stack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dumps'
          gh run download ${{ inputs.dump_run_id }} --repo $env:GITHUB_REPOSITORY --name crash-dumps-windows-x64 --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'no crash-dumps-windows-x64 artifact in that run' }
          $cdb = @("${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe", "$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) { throw 'cdb not found' }
          foreach ($d in Get-ChildItem $dir -Recurse -Filter *.dmp) {
            "=== $($d.Name)"
            $out = & $cdb -z $d.FullName -c '.exr -1; ~* kn 18; q' 2>&1
            $out | Where-Object { $_ -match 'ExceptionAddress|ExceptionCode|Attempt to|Parameter\[' } | Select-Object -First 8
            # One block per thread ("   5  Id: 1234.5678 ..."); keep the ones with Vulkan frames, then the first two others with Stride natives.
            $blocks = ($out -join "`n") -split '\n(?=\s*[.#]?\s*\d+\s+Id: )'
            $hits = @($blocks | Where-Object { $_ -match 'vulkan_lvp|vulkan_1' })
            "threads: $($blocks.Count), with Vulkan frames: $($hits.Count)"
            $hits | Select-Object -First 6
          }

  test:
    name: Install the released add-in (${{ matrix.name }})
    if: inputs.dump_run_id == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2025
            opendevelop_asset: OpenDevelop-win.7z
            viewport: '1'
          - name: linux-x64
            runner: ubuntu-24.04
            opendevelop_asset: OpenDevelop-linux-x64.tar.xz
            viewport: '1'
    steps:
      # The game the test opens, and the test project itself. The files above the test project are listed too: its PackageReference carries no
      # version (sources/Directory.Packages.props), global.json pins the SDK and nuget.config names the package sources. A leading slash anchors a
      # pattern at the repository root (non-cone mode).
      - uses: actions/checkout@v7
        with:
          lfs: true
          sparse-checkout: |
            /.github
            /global.json
            /nuget.config
            /sources/Directory.Build.props
            /sources/Directory.Packages.props
            /samples/nuget.config
            /samples/Templates/FirstPersonShooter
            /samples/Templates/Packs
            /sources/tools/Stride.OpenDevelop.AddIn.Tests
          sparse-checkout-cone-mode: false

      # The test project links OpenDevelop's own fixture sources; take the ones of the release being tested.
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.OPENDEVELOP_REPOSITORY }}
          ref: ${{ env.OPENDEVELOP_TAG }}
          path: opendevelop-src
          sparse-checkout: |
            tests/OpenDevelop.IntegrationTests
            .github/ci
          sparse-checkout-cone-mode: false

      - uses: actions/setup-dotnet@v6
        with:
          # 10.0: the SDK Stride's global.json pins, for the test project; 11.0: the runtime of the OpenDevelop host.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: bash opendevelop-src/.github/ci/install-linux-prerequisites.sh --display

      # The viewport check on Linux: software Vulkan (Mesa's lavapipe, the runner has no GPU) for the game, ImageMagick's import to read the screen,
      # xdotool to move the pointer and the host window, and libva for FFmpeg (see the native-library check below).
      - name: Install the Linux viewport check's tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers vulkan-tools xdotool imagemagick libva2 libva-drm2 > /dev/null

      # Diagnostic: Windows rendering with Vulkan through Stride's Lavapipe (as Stride's own test-windows-game.yml registers it), so a Linux
      # rendering difference can be told apart from a Vulkan/Lavapipe one.
      - name: Install the Vulkan runtime (Windows, Vulkan diagnostic)
        if: runner.os == 'Windows' && inputs.windows_vulkan
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.341.1
          install_runtime: true
          cache: true
          stripdown: true

      # The Khronos validation layer reports a use of a destroyed or invalid Vulkan object by name, where Lavapipe just faults. Registered
      # through the registry as in Stride's own test-windows-game.yml (the loader ignores VK_LAYER_PATH for elevated processes), and enabled
      # for every instance with VK_INSTANCE_LAYERS; its messages go to the process's stdout, which the test prints when the IDE dies.
      - name: Enable the Vulkan validation layer (Windows, Vulkan diagnostic)
        if: runner.os == 'Windows' && inputs.windows_vulkan
        shell: pwsh
        run: |
          $manifest = Join-Path $env:VULKAN_SDK 'Bin\VkLayer_khronos_validation.json'
          if (-not (Test-Path $manifest)) { "::warning::no validation layer in the Vulkan SDK install ($manifest)"; return }
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers' -Name $manifest -Value 0 -PropertyType DWord -Force | Out-Null
          'VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation' >> $env:GITHUB_ENV
          # Also write the messages to a file: on stdout the C runtime buffers them, so the last ones before a crash are lost with the
          # process. The file sits with the screenshots, which are uploaded.
          $shots = Join-Path $env:RUNNER_TEMP 'viewport-shots'
          New-Item -ItemType Directory -Force $shots | Out-Null
          "VK_KHRONOS_VALIDATION_LOG_FILENAME=$shots\validation.log" >> $env:GITHUB_ENV
          'VK_KHRONOS_VALIDATION_DEBUG_ACTION=VK_DBG_LAYER_ACTION_LOG_MSG' >> $env:GITHUB_ENV
          "validation layer: $manifest"

      - name: Register Stride's Lavapipe (Windows, Vulkan diagnostic)
        if: runner.os == 'Windows' && inputs.windows_vulkan
        shell: pwsh
        run: |
          $version = ([regex]'PackageVersion Include="Stride.Dependencies.Lavapipe" Version="([^"]+)"').Match((Get-Content sources/Directory.Packages.props -Raw)).Groups[1].Value
          $dir = Join-Path $env:RUNNER_TEMP 'lavapipe'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/stride.dependencies.lavapipe/$version/stride.dependencies.lavapipe.$version.nupkg" -OutFile (Join-Path $dir 'lavapipe.zip')
          Expand-Archive (Join-Path $dir 'lavapipe.zip') (Join-Path $dir 'pkg') -Force
          $dll = Get-ChildItem (Join-Path $dir 'pkg') -Recurse -Filter vulkan_lvp.dll | Where-Object { $_.DirectoryName -match 'win-x64' } | Select-Object -First 1
          if (-not $dll) { throw "no win-x64 vulkan_lvp.dll in Stride.Dependencies.Lavapipe $version" }
          $icd = Join-Path $dll.DirectoryName 'lvp_icd_registered.json'
          Set-Content $icd ('{"file_format_version":"1.0.0","ICD":{"library_path":"' + ($dll.FullName -replace '\\', '\\') + '","api_version":"1.3.0"}}')
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null
          'STRIDE_GRAPHICS_API=Vulkan' >> $env:GITHUB_ENV
          "Windows renders with Vulkan through Stride.Dependencies.Lavapipe $version ($($dll.FullName))"
          # A native crash in the IDE (seen: access violation after a host-window resize) leaves only managed frames in its output: have the
          # runtime write a minidump so the next step can print the native stack.
          $dumps = Join-Path $env:RUNNER_TEMP 'dumps'
          New-Item -ItemType Directory -Force $dumps | Out-Null
          'DOTNET_DbgEnableMiniDump=1' >> $env:GITHUB_ENV
          'DOTNET_DbgMiniDumpType=2' >> $env:GITHUB_ENV
          "DOTNET_DbgMiniDumpName=$dumps\%e.%p.dmp" >> $env:GITHUB_ENV

      # Which Vulkan driver renders: by default the Lavapipe build Stride's own Linux GPU tests use and compare with their gold images
      # (test-linux-game.yml: Stride.Dependencies.Lavapipe, version pinned in sources/Directory.Packages.props), forced with VK_DRIVER_FILES as
      # there; 'mesa' leaves Ubuntu's Mesa drivers to the loader.
      - name: Select the Linux Vulkan driver
        if: runner.os == 'Linux'
        shell: bash
        run: |
          driver="${{ inputs.linux_vulkan || 'stride' }}"
          if [ "$driver" = stride ]; then
            version=$(sed -n 's/.*PackageVersion Include="Stride.Dependencies.Lavapipe" Version="\([^"]*\)".*/\1/p' sources/Directory.Packages.props)
            dir="$RUNNER_TEMP/lavapipe"
            mkdir -p "$dir"
            curl -sSfL "https://api.nuget.org/v3-flatcontainer/stride.dependencies.lavapipe/$version/stride.dependencies.lavapipe.$version.nupkg" -o "$dir/lavapipe.nupkg"
            unzip -q "$dir/lavapipe.nupkg" -d "$dir/pkg"
            lib=$(find "$dir/pkg" -path "*/runtimes/linux-x64/native/libvulkan_lvp.so" | head -1)
            if [ -z "$lib" ]; then echo "::error::no libvulkan_lvp.so in Stride.Dependencies.Lavapipe $version"; exit 1; fi
            echo "{\"file_format_version\":\"1.0.0\",\"ICD\":{\"library_path\":\"$(readlink -f "$lib")\",\"api_version\":\"1.3.0\"}}" > "$dir/lvp_icd.json"
            echo "VK_DRIVER_FILES=$dir/lvp_icd.json" >> "$GITHUB_ENV"
            echo "Vulkan driver: Stride.Dependencies.Lavapipe $version ($lib)"
          else
            echo "Vulkan driver: Ubuntu's Mesa"
          fi
          VK_DRIVER_FILES="$( [ "$driver" = stride ] && echo "$dir/lvp_icd.json" )" vulkaninfo --summary 2>/dev/null | grep -E "deviceName|driverName|driverInfo|apiVersion" | head -8 || true

      - name: Download the add-in release and verify its digest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force $dir | Out-Null
          if ($env:STRIDE_RUN_ID) {
            # An unreleased build: the package artifact of a release-odaddin.yml run (it has no release digest to compare with).
            gh run download $env:STRIDE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:ASSET --dir $dir
            if ($LASTEXITCODE -ne 0) { throw "could not download the package artifact of run $env:STRIDE_RUN_ID" }
            $file = (Get-ChildItem $dir -Recurse -Filter $env:ASSET | Select-Object -First 1).FullName
            if (-not $file) { throw "run $env:STRIDE_RUN_ID has no $env:ASSET artifact" }
            "testing the package of run $env:STRIDE_RUN_ID, not a release: $((Get-Item $file).Length) bytes, sha256 $((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())"
            "STRIDE_ODADDIN=$file" >> $env:GITHUB_ENV
            return
          }
          $release = gh release view $env:STRIDE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "no release $env:STRIDE_TAG in $env:GITHUB_REPOSITORY" }
          if ($release.isDraft) { throw "$env:STRIDE_TAG is a draft" }
          $asset = $release.assets | Where-Object { $_.name -eq $env:ASSET }
          if (-not $asset) { throw "the release has no asset $env:ASSET" }
          gh release download $env:STRIDE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'could not download the add-in' }
          $file = Join-Path $dir $env:ASSET
          $actual = 'sha256:' + (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $asset.digest) { throw "digest mismatch: release says $($asset.digest), downloaded file is $actual" }
          "the downloaded $env:ASSET is $((Get-Item $file).Length) bytes, $actual"
          "STRIDE_ODADDIN=$file" >> $env:GITHUB_ENV

      - name: Download OpenDevelop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'opendevelop'
          New-Item -ItemType Directory -Force $root | Out-Null
          gh release download $env:OPENDEVELOP_TAG --repo $env:OPENDEVELOP_REPOSITORY --pattern '${{ matrix.opendevelop_asset }}' --dir $root
          if ($LASTEXITCODE -ne 0) { throw 'could not download OpenDevelop' }
          $archive = Join-Path $root '${{ matrix.opendevelop_asset }}'
          if ($IsWindows) { 7z x $archive "-o$root" -y | Out-Null }
          elseif ($IsMacOS) {
            # A DMG: mount it, copy the app out (the mounted image is read-only and goes away), detach.
            $mount = Join-Path $env:RUNNER_TEMP 'dmg'
            hdiutil attach $archive -mountpoint $mount -nobrowse -quiet
            if ($LASTEXITCODE -ne 0) { throw 'could not mount the OpenDevelop DMG' }
            try { cp -R (Get-ChildItem $mount -Filter '*.app' | Select-Object -First 1).FullName $root } finally { hdiutil detach $mount -quiet }
          }
          else { tar -xf $archive -C $root }
          if ($LASTEXITCODE -ne 0) { throw 'could not extract OpenDevelop' }
          # The archive's top folder name is not part of any contract: find the folder that holds the host.
          $dll = Get-ChildItem $root -Recurse -Depth 6 -Filter 'OpenDevelop.dll' | Select-Object -First 1
          if (-not $dll) { throw "OpenDevelop.dll is not in $env:OPENDEVELOP_TAG" }
          "OD_IT_IDE_DLL=$($dll.FullName)" >> $env:GITHUB_ENV
          "host: $($dll.FullName)"

      # Linux has no scene viewport yet, so nothing opens the package's native libraries there. Do what a load would do first: every shared
      # library of the package (the graphics-API folders and the root) must resolve all of its own dependencies, from its folder or from the
      # system. A missing one (an FFmpeg or SDL library that was not staged) fails when the editor starts.
      # System libraries the package relies on, as on a desktop: FFmpeg needs VA-API (libva2, libva-drm2, part of every desktop install).
      # webgpu_dawn.so is skipped: it is Stride's optional WebGPU backend, unused by the Vulkan editor path, and needs libc++, which desktops lack.
      - name: Check that the package's Linux native libraries resolve
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y -qq libva2 libva-drm2 > /dev/null
          dir="$RUNNER_TEMP/package"
          mkdir -p "$dir"
          unzip -q "$STRIDE_ODADDIN" -d "$dir"
          failed=0
          checked=0
          for native in "$dir/Vulkan/runtimes/linux-x64/native" "$dir/runtimes/linux-x64/native"; do
            if [ ! -d "$native" ]; then echo "::error::the package has no $native"; failed=1; continue; fi
            for lib in "$native"/*.so*; do
              [ -e "$lib" ] || continue
              case "$lib" in */webgpu_dawn.so) continue ;; esac
              checked=$((checked + 1))
              missing=$(LD_LIBRARY_PATH="$native" ldd "$lib" 2>&1 | grep -E 'not found|not a dynamic' || true)
              if [ -n "$missing" ]; then echo "::error::${lib#$dir/}: $(echo $missing)"; failed=1; fi
            done
          done
          echo "checked $checked shared libraries"
          if [ "$checked" -lt 20 ]; then echo "::error::only $checked shared libraries found; the Linux natives are missing"; failed=1; fi
          exit $failed

      # Without the game's packages (Stride's engine assets and shaders) the game faults and the viewport is black while everything reports
      # "running": restore it so the viewport check sees a real scene.
      - name: Restore the Stride game
        if: matrix.viewport == '1'
        shell: bash
        env:
          NuGetPackageSourceCredentials_lextudio_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: |
          mkdir -p ../OpenDevelop/artifacts/openavalon-feed
          # nuget.config lists Stride's own local package folder; NuGet fails on a source that does not exist (NU1301).
          mkdir -p bin/packages
          dotnet restore samples/Templates/FirstPersonShooter/FirstPersonShooter/FirstPersonShooter.Game/FirstPersonShooter.Game.csproj
          # The editor resolves the executable project's references too (NETSDK1004 without its assets file).
          dotnet restore samples/Templates/FirstPersonShooter/FirstPersonShooter/FirstPersonShooter.Windows/FirstPersonShooter.Windows.csproj

      - name: Install the released add-in, restart, open a Stride game
        shell: bash
        env:
          STRIDE_CHECKOUT_ROOT: ${{ github.workspace }}
          STRIDE_CHECK_VIEWPORT: ${{ matrix.viewport }}
          STRIDE_VIEWPORT_SHOT_DIR: ${{ runner.temp }}/viewport-shots
          # NuGet fails on a local source that does not exist (nuget.config lists a developer's synchronized OpenAvalon feed beside the checkout).
          NuGetPackageSourceCredentials_lextudio_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: |
          # Relative to the workspace (the step's working directory): on Windows $GITHUB_WORKSPACE has backslashes that dirname does not split.
          mkdir -p ../OpenDevelop/artifacts/openavalon-feed
          cd sources/tools/Stride.OpenDevelop.AddIn.Tests
          run=(dotnet run -c Release "-p:OpenDevelopRoot=$GITHUB_WORKSPACE/opendevelop-src/" -- -class Stride.OpenDevelop.AddIn.Tests.StrideOdaddinInstallTests -parallel none)
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a -s "-screen 0 1920x1200x24" "${run[@]}"); fi
          set +e
          "${run[@]}" 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
          status=${PIPESTATUS[0]}
          set -e
          # A skipped test is reported as a pass: this one only counts when it ran.
          summary=$(grep -E 'Total: [0-9]+' "$RUNNER_TEMP/test-output.txt" | tail -1 || true)
          echo "summary: $summary"
          if ! echo "$summary" | grep -Eq 'Total: 1, Errors: 0, Failed: 0, Skipped: 0'; then
            echo "::error::the install journey did not run to a pass: $summary"
            exit 1
          fi
          exit "$status"

      - name: Print the native stack of a crash (Windows, Vulkan diagnostic)
        if: always() && runner.os == 'Windows' && inputs.windows_vulkan
        shell: pwsh
        run: |
          $dumps = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'dumps') -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) { 'no crash dump'; return }
          $cdb = @("${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe", "$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) { "cdb not found; dumps: $($dumps.FullName -join ', ')"; return }
          foreach ($d in $dumps) {
            "=== $($d.Name) ($([int]($d.Length / 1MB)) MB)"
            $out = & $cdb -z $d.FullName -c '.exr -1; ~* kn 14; q' 2>&1
            $out | Where-Object { $_ -match 'ExceptionAddress|ExceptionCode|Attempt to|Parameter' } | Select-Object -First 8
            # One block per thread ("   5  Id: 1234.5678 ..."); keep the ones with Vulkan frames on their stacks.
            $blocks = ($out -join "`n") -split '\n(?=\s*[.#]?\s*\d+\s+Id: )'
            $hits = @($blocks | Where-Object { $_ -match 'vulkan_lvp|vulkan_1' })
            "threads with Vulkan frames: $($hits.Count) of $($blocks.Count)"
            $hits | Select-Object -First 4
          }

      - name: Upload the crash dumps (Windows, Vulkan diagnostic)
        if: always() && runner.os == 'Windows' && inputs.windows_vulkan
        uses: actions/upload-artifact@v7
        with:
          name: crash-dumps-${{ matrix.name }}
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload the viewport screenshots
        if: always() && matrix.viewport == '1'
        uses: actions/upload-artifact@v7
        with:
          name: viewport-${{ matrix.name }}
          path: ${{ runner.temp }}/viewport-shots
          if-no-files-found: warn
          retention-days: 7
